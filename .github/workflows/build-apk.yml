name: Build DSH Go APK (debug arm64)

# Self-hosted fork build: manual trigger only.
# Debug flavor skips the bundled proot runtime, so this is much lighter than a release build.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: 'Version name, e.g. 1.1.0-codex.1'
        required: false
        default: '1.1.0-codex.1'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Write android/local.properties
        working-directory: app
        run: |
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' "$ANDROID_HOME" "$FLUTTER_ROOT" > android/local.properties

      - name: Build debug APK
        working-directory: app
        run: |
          flutter build apk --debug --flavor arm64 \
            --target-platform android-arm64 \
            --build-name "${{ inputs.build_name }}"

      - name: List output
        run: ls -lh app/build/app/outputs/flutter-apk/

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-debug-arm64
          path: app/build/app/outputs/flutter-apk/app-arm64-debug.apk
          if-no-files-found: error
          retention-days: 14
